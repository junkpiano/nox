plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'garden.nox'
version = '1.0.0'

android {
  namespace "garden.nox.crypto"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // libsecp256k1, the C library Bitcoin Core uses, with its Android JNI build.
  // 0.19 is the last built with Kotlin 2.1, which this app compiles with.
  implementation "fr.acinq.secp256k1:secp256k1-kmp-jni-android:0.19.0"
}
