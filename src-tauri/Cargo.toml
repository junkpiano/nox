[package]
name = "nox"
version = "1.0.0"
description = "nox relay-first Nostr client"
authors = ["Yusuke Ohashi"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.85"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-http = "2"
keyring-core = "1.0.0"

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1.0"
jni = "0.21"
ndk-context = "0.1.1"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
apple-native-keyring-store = "1.0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1.1"

[target.'cfg(target_os = "linux")'.dependencies]
linux-keyutils-keyring-store = "1.0.0"

# No [profile.release] overrides are set, and one in particular must not be.
#
# `panic = "abort"` would disable the catch_unwind in src/secret_store.rs. The
# Android keyring backend panics rather than returning an error when its JNI
# context is missing, so aborting there takes the whole app down at launch on
# any device where the credential store cannot start, instead of falling back
# to frontend storage. Size is not a problem today: the release AAB is ~26 MB
# and Play delivers roughly 19 MB per device.
