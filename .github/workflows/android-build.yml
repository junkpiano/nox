name: Android

# The phone app in native/ (React Native, garden.nox), built when something
# reaches main and on demand; pull requests do not wait for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Asking for no packages: the action's default list still names `tools`,
      # which Google has withdrawn, and sdkmanager fails on a missing package.
      # Gradle installs the NDK React Native asks for.
      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      # The app imports ../src, so both trees need their dependencies.
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          npm ci --prefix native

      - name: Type-check the app
        run: npx tsc --noEmit -p native

      # native/android is not committed: generated fresh, it cannot drift
      # from app.json.
      - name: Generate the Android project
        working-directory: native
        run: npx expo prebuild --platform android --no-install

      # Every upload to Google Play needs a higher version code. Past the run
      # numbers of the Tauri builds this workflow used to make, and past the
      # first bundle uploaded by hand.
      - name: Set the version code
        run: |
          CODE=$((1000 + ${{ github.run_number }}))
          sed -i -E "s/versionCode [0-9]+/versionCode $CODE/" native/android/app/build.gradle
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      # Signed with the Play upload key when its secrets are set; otherwise
      # with the debug key, which installs but cannot go to Google Play.
      - name: Build
        working-directory: native/android
        env:
          KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          SIGNING=()
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            SIGNING=(
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/upload.jks"
              -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD"
              -Pandroid.injected.signing.key.alias=upload
              -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            )
            echo "SIGNED=upload key" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_UPLOAD_KEYSTORE is not set; signed with the debug key."
            echo "SIGNED=debug key" >> "$GITHUB_ENV"
          fi
          ./gradlew bundleRelease assembleRelease "${SIGNING[@]}"
          rm -f "$RUNNER_TEMP/upload.jks"

      - name: Report
        run: |
          OUT=native/android/app/build/outputs
          AAB=$OUT/bundle/release/app-release.aab
          APK=$OUT/apk/release/app-release.apk
          test -f "$AAB" && test -f "$APK"
          {
            echo "### Android ${{ env.VERSION_CODE }} ($SIGNED)"
            echo ""
            echo "- \`app-release.aab\` — $(du -h "$AAB" | cut -f1), for Google Play"
            echo "- \`app-release.apk\` — $(du -h "$APK" | cut -f1), to install directly"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nox-android-${{ env.VERSION_CODE }}
          path: |
            native/android/app/build/outputs/bundle/release/app-release.aab
            native/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
