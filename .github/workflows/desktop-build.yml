name: Windows and Linux

# The desktop app had never been built for Windows or Linux. This builds both
# on every change that can break them and keeps the installers.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: msi,nsis
            out: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
          # The oldest supported Ubuntu: a binary built against an older glibc
          # runs on newer distributions, not the other way round.
          - os: ubuntu-22.04
            name: linux
            bundles: deb,rpm,appimage
            out: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: bun install --frozen-lockfile

      # Catches type and lint breakage before spending minutes on Rust. Once
      # is enough: the web build is the same on both.
      - name: Check the web build
        if: matrix.name == 'linux'
        run: |
          bun run build
          bun run test

      # Unsigned: Windows shows a SmartScreen warning until there is a code
      # signing certificate. Linux packages are not signed.
      - name: Build
        run: bunx tauri build --bundles ${{ matrix.bundles }}

      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14
