name: Windows and Linux

# Builds the desktop app for Windows and Linux and keeps the installers.
# Built when something reaches main, and on demand; pull requests do not wait
# for it.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
            bundles: msi,nsis
            out: |
              src-tauri/target/release/bundle/msi/*.msi
              src-tauri/target/release/bundle/nsis/*.exe
              msix/*.msix
          # The oldest supported Ubuntu: a binary built against an older glibc
          # runs on newer distributions, not the other way round.
          - os: ubuntu-22.04
            name: linux
            bundles: deb,rpm,appimage
            out: |
              src-tauri/target/release/bundle/deb/*.deb
              src-tauri/target/release/bundle/rpm/*.rpm
              src-tauri/target/release/bundle/appimage/*.AppImage

    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Install the Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev libdbus-1-dev patchelf

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.name }}

      - run: bun install --frozen-lockfile

      # Catches type and lint breakage before spending minutes on Rust. Once
      # is enough: the web build is the same on both.
      - name: Check the web build
        if: matrix.name == 'linux'
        run: |
          bun run build
          bun run test

      # Unsigned: Windows shows a SmartScreen warning until there is a code
      # signing certificate. Linux packages are not signed.
      - name: Build
        run: bunx tauri build --bundles ${{ matrix.bundles }}

      # The Microsoft Store package, from the same nox.exe. Unsigned: the Store
      # signs what it distributes. Identity comes from repository variables
      # set from Partner Center; without them it is a packaging check only.
      - name: Package for the Microsoft Store
        if: matrix.name == 'windows'
        shell: bash
        env:
          IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME || 'nox.unreserved' }}
          PUBLISHER: ${{ vars.MSIX_PUBLISHER || 'CN=nox-unreserved' }}
          PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME || 'nox' }}
          VERSION: 1.0.${{ github.run_number }}.0
          WINAPP_CLI_TELEMETRY_OPTOUT: '1'
        run: |
          STAGE=msix/stage
          mkdir -p "$STAGE"
          cp src-tauri/target/release/nox.exe "$STAGE/"
          sed -e "s|__IDENTITY_NAME__|$IDENTITY_NAME|" \
              -e "s|__PUBLISHER__|$PUBLISHER|" \
              -e "s|__PUBLISHER_DISPLAY_NAME__|$PUBLISHER_DISPLAY_NAME|" \
              -e "s|__VERSION__|$VERSION|" \
              src-tauri/msix/Package.appxmanifest > "$STAGE/Package.appxmanifest"
          WINAPP="npx -y -p @microsoft/winappcli@0.7.1 winapp"
          $WINAPP manifest update-assets src-tauri/icons/icon.png --manifest "$STAGE/Package.appxmanifest"
          $WINAPP pack "$STAGE" --manifest "$STAGE/Package.appxmanifest" --no-sign --output "msix/nox_${VERSION}_x64.msix"
          ls -l msix/*.msix

      - uses: actions/upload-artifact@v4
        with:
          name: nox-${{ matrix.name }}
          path: ${{ matrix.out }}
          if-no-files-found: error
          retention-days: 14
